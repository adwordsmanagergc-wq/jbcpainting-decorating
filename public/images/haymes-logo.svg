<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 60" fill="none">
  <!-- Dark background pill -->
  <rect width="160" height="60" rx="8" fill="#1A1A1A"/>
  <!-- Orange accent bar -->
  <rect x="0" y="0" width="8" height="60" rx="4" fill="#F7941D"/>
  <!-- "HAYMES" wordmark -->
  <text x="90" y="28" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">HAYMES</text>
  <!-- "PAINT" subtext in orange -->
  <text x="90" y="44" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#F7941D" text-anchor="middle" letter-spacing="4">PAINT</text>
</svg>
